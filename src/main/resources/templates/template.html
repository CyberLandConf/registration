<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="robots" content="noindex, nofollow"/>
    <title>{#insert title}iJUG Event Registration App{/}</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css" />
    {#insert styles}{/}
</head>
<body>
    {#insert body}No body!{/}
    <script src="/webjars/jquery/jquery.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
    {#insert scripts}{/}
    <script>
        {|
        // Qute raw block: without it the JS object literal below reads as a Qute expression.
        // Reports the content height to the embedding page so its <iframe> can grow along.
        // The other end is optional -- without a listener the iframe simply keeps its
        // configured height. See docs/handbuch.adoc.
        (function () {
            if (window.parent === window) return; // not embedded

            var last = -1;
            // The ResizeObserver delivers the first value on its own and also catches images and
            // web fonts that load later -- an extra load handler would be redundant. It fires on
            // pure width changes as well, hence the comparison against last.
            new ResizeObserver(function () {
                // Deliberately the height of <body> and not of the document: the document height
                // grows to at least the viewport height, which would keep the iframe from ever
                // shrinking again after it grew. Bootstrap's Reboot sets margin:0 on body, so the
                // plain box height is enough.
                var height = Math.ceil(document.body.getBoundingClientRect().height);
                if (height === last) return;
                last = height;
                // The target origin is unknown (any JUG website), so the receiver is the one that
                // checks where the message came from -- see the snippet in docs/handbuch.adoc.
                window.parent.postMessage({type: 'ijug-registration:height', height: height}, '*');
            }).observe(document.body);
        })();
        |}
    </script>
</body>
</html>
